# PROTECTED MASTER ONLY: independent PR path/identity validation, never run PR code.
name: JM CAS Controller Protected Base Oracle
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: jm-cas-controller-oracle-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  protected-base-oracle:
    name: jm-cas-controller-protected-oracle
    if: github.repository == 'olivesoup/jm-public-cas-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live exact PR head and bounded source update paths from protected base only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          REPO = 'olivesoup/jm-public-cas-controller'
          if os.environ.get('GITHUB_REPOSITORY') != REPO:
              raise SystemExit('JM_CAS_ORACLE_DENIED_WRONG_REPOSITORY')
          if os.environ.get('GITHUB_EVENT_NAME') != 'pull_request_target':
              raise SystemExit('JM_CAS_ORACLE_DENIED_WRONG_EVENT')
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)
          number = event.get('number')
          claim = event.get('pull_request', {})
          if type(number) is not int or number <= 0 or type(claim) is not dict:
              raise SystemExit('JM_CAS_ORACLE_DENIED_EVENT_INVALID')
          token = os.environ.get('GH_TOKEN', '')
          if not token:
              raise SystemExit('JM_CAS_ORACLE_DENIED_NO_READ_TOKEN')
          def get(path):
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + path,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer ' + token,
                      'X-GitHub-Api-Version': '2022-11-28'
                  })
              with urllib.request.urlopen(req, timeout=18) as response:
                  if response.status != 200:
                      raise SystemExit('JM_CAS_ORACLE_DENIED_API_STATUS')
                  return json.load(response)

          pr = get('/pulls/' + str(number))
          branch = get('/branches/master')
          if (pr.get('number') != number or pr.get('state') != 'open' or
              pr.get('draft') is not False or
              pr.get('head', {}).get('repo', {}).get('full_name') != REPO or
              pr.get('base', {}).get('repo', {}).get('full_name') != REPO or
              pr.get('base', {}).get('ref') != 'master' or
              branch.get('commit', {}).get('sha') != pr.get('base', {}).get('sha') or
              branch.get('commit', {}).get('sha') != os.environ.get('GITHUB_SHA') or
              pr.get('head', {}).get('sha') != claim.get('head', {}).get('sha') or
              pr.get('base', {}).get('sha') != claim.get('base', {}).get('sha')):
              raise SystemExit('JM_CAS_ORACLE_DENIED_EXACT_HEAD_BASE_IDENTITY')
          paths = []
          for page in range(1, 11):
              items = get('/pulls/' + str(number) + '/files?per_page=100&page=' + str(page))
              if type(items) is not list:
                  raise SystemExit('JM_CAS_ORACLE_DENIED_FILES_SHAPE')
              for item in items:
                  if type(item) is not dict:
                      raise SystemExit('JM_CAS_ORACLE_DENIED_FILE_ENTRY')
                  paths.append(item.get('filename'))
                  if item.get('status') == 'renamed':
                      paths.append(item.get('previous_filename'))
              if len(items) < 100:
                  break
          else:
              raise SystemExit('JM_CAS_ORACLE_DENIED_TOO_MANY_FILES')
          if not paths:
              raise SystemExit('JM_CAS_ORACLE_DENIED_EMPTY_CHANGE')
          allowed = ('scripts/', 'ledger/', 'tests/', 'standards/', 'public-notes/')
          for path in paths:
              if (type(path) is not str or not path or
                  not (path == 'README.md' or path.startswith(allowed)) or
                  '..' in pathlib.PurePosixPath(path).parts):
                  raise SystemExit('JM_CAS_ORACLE_DENIED_PROTECTED_OR_UNLISTED_PATH')
          print('JM_CAS_PROTECTED_BASE_ORACLE_SOURCE_SCOPE_PASS_NOT_CAS_REAL_GATE')
          print('JM_CAS_ORACLE_EXACT_HEAD=' + pr['head']['sha'])
          print('JM_CAS_ORACLE_EXACT_BASE=' + pr['base']['sha'])
          print('JM_CAS_ORACLE_PATH_COUNT=' + str(len(paths)))
          PY
